<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, intial-scale=1.0">
	<title>Adding Lists</title>
</head>

<body>
<h1>Adding Lists</h1>

<!-- Unordered list — bullet markers by default -->
<ul>
  <li>HTML</li>
  <li>CSS</li>
  <li>JavaScript</li>
</ul>

<!-- Ordered list — numbered markers by default -->
<ol start=3>
  <li>Plan the page structure</li>
  <li>Write the HTML</li>
  <li>Validate at validator.w3.org</li>
  <li>Add CSS styling in LP6</li>
</ol>


</body>

</html>
