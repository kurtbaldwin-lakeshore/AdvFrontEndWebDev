<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Door County Creamery</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="lp2.css" type="text/css">

    <body>
        <div class="product-card">
                <div class="product-photo-wrapper">
                <img src="preserves.jpg" alt="cherry jam jars" width="200"><!--Image by <a href="https://pixabay.com/users/robertazan-14202961/?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=4609436">robertazan</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=4609436">Pixabay</a>-->
                </div>
                <div class="product-body">
                <h2>Cherry Preserves</h2>

                <p class="product-price">$8.50</p>

                <p class="product-desc">Made with all-natural Door County Cherries for a sweet, fruity flavor.</p>

                <button class="custombutton">Add to Cart</button>
                </div> 
        </div>

        <div class="product-card">
                <div class="product-photo-wrapper">
                <img src="cheddar.jpg" alt="cheddar cheese wheels" width="200"><!--Image by <a href="https://pixabay.com/users/publicdomainpictures-14/?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=2785">PublicDomainPictures</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=2785">Pixabay</a>-->
                </div>

                <p class="product-price">$12</p>

                <button class="custombutton">Add to Cart</button>

                <div class="product-photo-wrapper">

                <h2>Cherry Wine</h2>

                <p class="product-desc">Made with all-natural Door County Cherries for a unique, fruity taste.</p>
