<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Driftless Cycle Co.</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <h1>Driftless Cycle Co.</h1>
      <p>Bikes, repairs and group rides in southwest Wisconsin.</p>
    </div>
  </header>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark" aria-label="Main">
    <div class="container">
      <a class="navbar-brand" href="index.html">Driftless Cycle Co.</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="main" class="container py-4">
    <h2 class="fw-bold mt-0">Contact the shop</h2>
    <p>Send us a note or ask about a fitting.</p>
    <form class="row g-3" action="#" method="post">
      <div class="col-12 col-md-6">
        <div class="form-floating">
          <input type="text" class="form-control" id="name" name="name" placeholder="Your name" autocomplete="name" required>
          <label for="name">Your name</label>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="form-floating">
          <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <label for="email">Email address</label>
        </div>
      </div>
      <div class="col-12">
        <div class="form-floating">
          <textarea class="form-control" id="msg" name="msg" placeholder="Message" style="height: 8rem" required></textarea>
          <label for="msg">Message</label>
        </div>
      </div>
      <div class="col-12"><button type="submit" class="btn btn-primary">Send message</button></div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container py-3">
      <p>&copy; 2026 Driftless Cycle Co. Teaching demo.</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
